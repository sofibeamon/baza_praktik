:root {
  --bg: #F3ECDC;
  --fg: #2E2418;
  --card: #FFFDF8;
  --primary: #3A4F35;
  --on-primary: #FFFFFF;
  --secondary: #6B4F3A;
  --muted: #E8DFC8;
  --muted-fg: #6E6350;
  --border: #DCD0B2;
  --ring: #3A4F35;
  --radius: 14px;
  --font-head: "Lora", Georgia, serif;
  --font-body: "Raleway", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121C15; --fg: #F1E9D8; --card: #1B2920; --primary: #7E9C74; --on-primary: #0F1712;
    --secondary: #C29A74; --muted: #263528; --muted-fg: #C3B79E; --border: #384A3A; --ring: #9DB894;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121C15; --fg: #F1E9D8; --card: #1B2920; --primary: #7E9C74; --on-primary: #0F1712;
  --secondary: #C29A74; --muted: #263528; --muted-fg: #C3B79E; --border: #384A3A; --ring: #9DB894;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; line-height: 1.25; margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Шапка */
.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--secondary); font-weight: 600; }
.title { font-size: 28px; margin-top: 4px; }
.lead { color: var(--muted-fg); margin: 8px 0 0; }

/* Фильтры */
.group { margin-top: 24px; }
.group h2 { font-size: 18px; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 10px 16px; border-radius: 999px; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); color: var(--fg);
  font-size: 15px; font-weight: 500; line-height: 1.2;
  transition: background-color .2s ease, border-color .2s ease, color .2s ease;
}
.chip:hover { border-color: var(--primary); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip.small { min-height: 44px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }

/* Результаты */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 28px 0 12px; flex-wrap: wrap; }
.count { font-weight: 600; color: var(--muted-fg); }
.actions { display: flex; gap: 8px; }
.ghost {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 12px;
  border-radius: 10px; border: 0; background: transparent; color: var(--primary);
  font-weight: 600; cursor: pointer; transition: background-color .2s ease;
}
.ghost:hover { background: var(--muted); }
.ghost[hidden] { display: none; }
.list { display: grid; gap: 10px; }
.card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; transition: border-color .2s ease, transform .2s ease;
}
.card:hover { border-color: var(--primary); }
.card:active { transform: scale(.99); }
.card h3 { font-size: 18px; }
.meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; color: var(--muted-fg); font-size: 14px; }
.meta .dot { opacity: .6; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--muted); color: var(--fg); }
.empty { padding: 24px 16px; text-align: center; color: var(--muted-fg); background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); }

/* Карточка практики */
.back { margin-left: -8px; }
.detail h1 { font-size: 26px; margin-top: 8px; }
.detail .meta { font-size: 15px; margin-top: 8px; }
.why { margin: 18px 0 0; font-size: 17px; }
.section-title { font-size: 18px; margin: 26px 0 12px; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: step; display: grid; gap: 12px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
.steps li::before {
  content: counter(step); width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 600; font-size: 15px;
  background: var(--muted); color: var(--primary);
}
.steps li span { padding-top: 4px; }
.note { margin-top: 22px; padding: 14px 16px; border-radius: var(--radius); background: var(--muted); }
.note p { margin: 0; }
.note p + p { margin-top: 6px; }
.cta { margin-top: 32px; padding: 18px 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); }
.cta p { margin: 0 0 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 20px;
  border-radius: 12px; background: var(--primary); color: var(--on-primary); text-decoration: none;
  font-weight: 600; cursor: pointer; border: 0; transition: opacity .2s ease;
}
.btn:hover { opacity: .9; }

.view[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  "Почувствовать себя": "Хочу почувствовать себя"
};
const ZONES = ["Глаза и голова", "Лицо, челюсть, горло", "Шея и плечи", "Грудь и между лопаток", "Дыхание", "Живот", "Таз и поясница", "Всё тело"];
const EXTRAS = [
  { key: "quick", label: "До 5 минут", test: p => p.quick },
  { key: "sit", label: "Можно сидя", test: p => p.sit }
];

// Скрипт Телеграма есть и в обычном браузере — там platform = "unknown", считаем, что Телеграма нет
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform !== "unknown" ? window.Telegram.WebApp : null;
const practices = DATA.practices;
const filter = { state: null, zone: null, quick: false, sit: false };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

function setupTelegram() {
  if (!tg) return;
  try {
    tg.ready(); tg.expand();
    document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    tg.setHeaderColor(bg); tg.setBackgroundColor(bg);
    tg.BackButton.onClick(goHome);
  } catch (e) {}
}

function chip(label, pressed, onClick, extraClass) {
  const b = document.createElement("button");
  b.className = "chip" + (extraClass ? " " + extraClass : "");
  b.type = "button";
  b.textContent = label;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.addEventListener("click", () => { haptic(); onClick(); });
  return b;
}

function renderFilters() {
  const usedStates = Object.keys(STATE_LABELS).filter(s => practices.some(p => p.states.includes(s)));
  const usedZones = ZONES.filter(z => practices.some(p => p.zones.includes(z)));
  const st = $("states"); st.innerHTML = "";
  usedStates.forEach(s => st.appendChild(chip(STATE_LABELS[s], filter.state === s, () => { filter.state = filter.state === s ? null : s; update(); })));
  const zn = $("zones"); zn.innerHTML = "";
  usedZones.forEach(z => zn.appendChild(chip(z, filter.zone === z, () => { filter.zone = filter.zone === z ? null : z; update(); })));
  const ex = $("extras"); ex.innerHTML = "";
  EXTRAS.forEach(x => ex.appendChild(chip(x.label, filter[x.key], () => { filter[x.key] = !filter[x.key]; update(); }, "small")));
}

function matches(p) {
  if (filter.state && !p.states.includes(filter.state)) return false;
  if (filter.zone && !p.zones.includes(filter.zone)) return false;
  return EXTRAS.every(x => !filter[x.key] || x.test(p));
}

function plural(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "практика";
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "практики";
  return "практик";
}

function metaHtml(p) {
  return `<div class="meta"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span>${esc(p.time)}</span><span class="dot">·</span><span>${esc(p.position)}</span></div>`;
}

function renderList() {
  const items = practices.filter(matches);
  const active = filter.state || filter.zone || filter.quick || filter.sit;
  $("count").textContent = `${items.length} ${plural(items.length)}`;
  $("reset").hidden = !active;
  $("random").dataset.pool = items.map(p => p.id).join(",");
  const list = $("list");
  if (!items.length) {
    list.innerHTML = `<div class="empty">Под такое сочетание практики пока нет. Попробуй убрать один из фильтров.</div>`;
    return;
  }
  list.innerHTML = items.map(p => `
    <button class="card" type="button" data-id="${esc(p.id)}">
      <h3>${esc(p.title)}</h3>
      ${metaHtml(p)}
      <div class="tags">${p.zones.map(z => `<span class="tag">${esc(z)}</span>`).join("")}</div>
    </button>`).join("");
}

function update() { renderFilters(); renderList(); }

function renderDetail(p) {
  const d = $("detail");
  const s = DATA.settings;
  d.innerHTML = `
    <button class="ghost back" type="button" id="backBtn"><svg class="icon"><use href="#i-back"/></svg>Все практики</button>
    <h1>${esc(p.title)}</h1>
    ${metaHtml(p)}
    <div class="tags">${p.states.map(x => `<span class="tag">${esc(STATE_LABELS[x] || x)}</span>`).join("")}</div>
    ${p.why ? `<p class="why">${esc(p.why)}</p>` : ""}
    ${p.steps.length ? `<h2 class="section-title">Как делать</h2><ol class="steps">${p.steps.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ol>` : ""}
    ${p.notes.length ? `<div class="note">${p.notes.map(x => `<p>${esc(x)}</p>`).join("")}</div>` : ""}
    ${s.link ? `<div class="cta"><p>${esc(s.cta)}</p><a class="btn" href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.button)}</a></div>` : ""}
  `;
  $("backBtn").addEventListener("click", goHome);
  const link = d.querySelector(".cta a");
  if (link && tg) link.addEventListener("click", e => {
    try { e.preventDefault(); /^https:\/\/t\.me\//.test(s.link) ? tg.openTelegramLink(s.link) : tg.openLink(s.link); } catch (err) { location.href = s.link; }
  });
}

// Адрес #p=… нужен, чтобы работала кнопка «назад» и можно было дать ссылку на практику.
// Где история недоступна (локальный предпросмотр), просто переключаем экраны.
let homeScroll = 0;

function idFromHash() {
  return location.hash.startsWith("#p=") ? decodeURIComponent(location.hash.slice(3)) : null;
}

function show(id) {
  const p = id && practices.find(x => x.id === id);
  if (p && $("detail").hidden) homeScroll = window.scrollY;
  $("home").hidden = !!p;
  $("detail").hidden = !p;
  if (p) { renderDetail(p); window.scrollTo(0, 0); } else { window.scrollTo(0, homeScroll); }
  try { if (tg) p ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

function openPractice(id) {
  try { history.pushState({ p: id }, "", "#p=" + encodeURIComponent(id)); } catch (e) {}
  show(id);
}

function goHome() {
  if (history.state && history.state.p) { history.back(); return; }
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  show(null);
}

function route() { show(idFromHash()); }

$("list").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openPractice(c.dataset.id); });
$("reset").addEventListener("click", () => { Object.assign(filter, { state: null, zone: null, quick: false, sit: false }); update(); });
$("random").addEventListener("click", () => {
  const pool = ($("random").dataset.pool || "").split(",").filter(Boolean);
  const ids = pool.length ? pool : practices.map(p => p.id);
  haptic(); openPractice(ids[Math.floor(Math.random() * ids.length)]);
});
window.addEventListener("popstate", route);

document.title = DATA.settings.title;
$("title").textContent = DATA.settings.title;
$("subtitle").textContent = DATA.settings.subtitle;
$("lead").textContent = DATA.settings.lead;
setupTelegram();
update();
route();
</script>
</body>
</html>
